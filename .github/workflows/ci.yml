name: Project gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic-ui-and-ftue:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Validate data and localization
        run: python3 tools/validate_data.py

      - name: Run logic suite
        run: godot --headless --path . tests/test_runner.tscn

      - name: Run assertion-based FTUE flow audit
        run: godot --headless --path . tests/flow_audit.tscn

      - name: Run assertion-based mid-game loop audit
        run: godot --headless --path . tests/midgame_audit.tscn

      - name: Play the complete touch-only tutorial
        run: xvfb-run -a godot --disable-vsync --max-fps 200 --path . tests/tutorial_playthrough.tscn

      - name: Run the full campaign gate on main
        if: github.ref == 'refs/heads/main'
        run: xvfb-run -a godot --disable-vsync --max-fps 200 --path . tests/full_campaign.tscn

      - name: Run hundred-datacenter integrity and performance smoke
        run: xvfb-run -a godot --disable-vsync --max-fps 240 --path . tests/performance_smoke.tscn -- --ci

      - name: Run SE Chinese rendered UI smoke
        run: xvfb-run -a godot --disable-vsync --max-fps 60 --path . tests/visual_smoke.tscn -- --profile=se --locale=zh_CN

      - name: Run SE English rendered UI smoke
        run: xvfb-run -a godot --disable-vsync --max-fps 60 --path . tests/visual_smoke.tscn -- --profile=se --locale=en

      - name: Run standard Chinese rendered UI smoke
        run: xvfb-run -a godot --disable-vsync --max-fps 60 --path . tests/visual_smoke.tscn -- --profile=standard --locale=zh_CN

      - name: Run standard English rendered UI smoke
        run: xvfb-run -a godot --disable-vsync --max-fps 60 --path . tests/visual_smoke.tscn -- --profile=standard --locale=en

      - name: Run iPad Chinese rendered UI smoke
        run: xvfb-run -a godot --disable-vsync --max-fps 60 --path . tests/visual_smoke.tscn -- --profile=ipad --locale=zh_CN

      - name: Run iPad English rendered UI smoke
        run: xvfb-run -a godot --disable-vsync --max-fps 60 --path . tests/visual_smoke.tscn -- --profile=ipad --locale=en
